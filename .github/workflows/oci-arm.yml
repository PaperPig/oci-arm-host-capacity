name: OCI ARM Capacity

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: oci-arm-capacity
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.OCI_REGION }}" || (echo "Missing OCI_REGION" && exit 1)
          test -n "${{ secrets.OCI_USER_ID }}" || (echo "Missing OCI_USER_ID" && exit 1)
          test -n "${{ secrets.OCI_TENANCY_ID }}" || (echo "Missing OCI_TENANCY_ID" && exit 1)
          test -n "${{ secrets.OCI_KEY_FINGERPRINT }}" || (echo "Missing OCI_KEY_FINGERPRINT" && exit 1)
          test -n "${{ secrets.OCI_PRIVATE_KEY_B64 }}" || (echo "Missing OCI_PRIVATE_KEY_B64" && exit 1)
          test -n "${{ secrets.OCI_SUBNET_ID }}" || (echo "Missing OCI_SUBNET_ID" && exit 1)
          test -n "${{ secrets.OCI_IMAGE_ID }}" || (echo "Missing OCI_IMAGE_ID" && exit 1)
          test -n "${{ secrets.OCI_SSH_PUBLIC_KEY }}" || (echo "Missing OCI_SSH_PUBLIC_KEY" && exit 1)

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Write private key
        run: |
          mkdir -p "$HOME/.oci"
          echo "${{ secrets.OCI_PRIVATE_KEY_B64 }}" | base64 -d > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

      - name: Create .env
        run: |
          cat > .env <<EOF
          OCI_REGION=${{ secrets.OCI_REGION }}
          OCI_USER_ID=${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME=${HOME}/.oci/oci_api_key.pem
          OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}
          OCI_SSH_PUBLIC_KEY="${{ secrets.OCI_SSH_PUBLIC_KEY }}"
          OCI_SHAPE=${{ secrets.OCI_SHAPE }}
          OCI_OCPUS=${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS=${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_MAX_INSTANCES=${{ secrets.OCI_MAX_INSTANCES }}
          OCI_AVAILABILITY_DOMAIN=${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          CACHE_AVAILABILITY_DOMAINS=${{ secrets.CACHE_AVAILABILITY_DOMAINS }}
          TOO_MANY_REQUESTS_TIME_WAIT=${{ secrets.TOO_MANY_REQUESTS_TIME_WAIT }}
          EOF

      - name: Run script
        run: php ./index.php
